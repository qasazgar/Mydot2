info:
  name: Check balance IRR
  type: http
  seq: 4

http:
  method: GET
  url: "{{Url}}/payments/wallet/"
  headers:
    - name: X-Platform
      value: mweb
    - name: sec-ch-ua-platform
      value: '"Windows"'
    - name: Referer
      value: https://mydot.one/
    - name: User-Agent
      value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/158.0.0.0 Safari/537.36
    - name: Accept
      value: application/json, text/plain, */*
    - name: sec-ch-ua
      value: '"Chromium";v="158", "Not.A/Brand";v="24", "Google Chrome";v="158"'
    - name: sec-ch-ua-mobile
      value: ?0
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
