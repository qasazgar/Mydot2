info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: https://api.mydot.one/mydot/api/v1/auth/login/
  headers:
    - name: accept
      value: application/json, text/plain, */*
    - name: accept-language
      value: en-GB,en;q=0.9,fa-IR;q=0.8,fa;q=0.7,en-US;q=0.6
    - name: cache-control
      value: no-cache
    - name: content-type
      value: application/json
    - name: Cookie
      value: csrftoken=1myTX0tPxIMZ41BbVHFKcL5NjpfhsjGM; sessionid=v0afup4cq8ctofux08e37nwklnel09fn; _clck=1dpuog2%5E2%5Eg94%5E0%5E2436
    - name: origin
      value: https://mydot.one
    - name: pragma
      value: no-cache
    - name: priority
      value: u=1, i
    - name: referer
      value: https://mydot.one/
    - name: sec-ch-ua
      value: '"Chromium";v="152", "Not?A_Brand";v="24", "Google Chrome";v="152"'
    - name: sec-ch-ua-mobile
      value: ?1
    - name: sec-ch-ua-platform
      value: '"iOS"'
    - name: sec-fetch-dest
      value: empty
    - name: sec-fetch-mode
      value: cors
    - name: sec-fetch-site
      value: same-site
    - name: user-agent
      value: Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1
  body:
    type: json
    data: |-
      {
        "identifier": "sazgar",
        "password": "Ahmad@123"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        tests :{
          test("Status code should be 200", function() {
            expect(res.status).to.equal(200);
          });

          test("Response time should be less than 2000 ms", function() {
            expect(res.responseTime).to.be.lessThan(2000);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
